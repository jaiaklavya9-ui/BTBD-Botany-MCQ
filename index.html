<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTBD Botany Exam</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f6;
    color:#222;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    background:white;
    border-radius:26px;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:32px;
    line-height:1.2;
}

.header p{
    margin:12px 0 0;
    color:#666;
    font-size:19px;
}

/* EXAM CARD */

.card{
    background:white;
    border-radius:26px;
    padding:24px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    font-size:20px;
    font-weight:bold;
}

.timer{
    background:#f1f1f1;
    padding:11px 17px;
    border-radius:25px;
    white-space:nowrap;
}

/* PROGRESS */

.progress{
    height:13px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#222;
    transition:width .3s ease;
}

/* TOPIC */

.topic{
    display:inline-block;
    background:#eaf0ff;
    padding:9px 17px;
    border-radius:25px;
    margin-bottom:15px;
    font-size:17px;
}

/* QUESTION */

.question{
    font-size:25px;
    line-height:1.45;
    font-weight:bold;
    margin-bottom:20px;
}

/* OPTIONS */

.option{
    border:3px solid #ddd;
    border-radius:18px;
    padding:17px;
    margin:12px 0;
    font-size:19px;
    cursor:pointer;
    background:white;
    transition:all .15s ease;
    user-select:none;
}

.option:hover{
    border-color:#999;
}

.option:active{
    transform:scale(.985);
}

.option.selected{
    border-color:#222;
    background:#f1f1f1;
}

.option.correct{
    border-color:#16a34a;
    background:#dcfce7;
}

.option.wrong{
    border-color:#dc2626;
    background:#fee2e2;
}

/* BUTTONS */

button{
    width:100%;
    border:none;
    border-radius:18px;
    padding:17px;
    font-size:19px;
    font-weight:bold;
    cursor:pointer;
    transition:transform .15s ease;
}

button:active{
    transform:scale(.98);
}

.next{
    background:#222;
    color:white;
    margin-top:15px;
}

.submit{
    background:#b91c1c;
    color:white;
    margin-top:5px;
}

/* RESULT */

.result{
    display:none;
    text-align:center;
}

.result h2{
    font-size:32px;
}

.score{
    font-size:58px;
    font-weight:bold;
    margin:20px 0;
}

.pass{
    color:#16a34a;
}

.fail{
    color:#dc2626;
}

.stats{
    font-size:18px;
    line-height:1.8;
}

/* CONGRATULATION POPUP */

.congrats{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.congrats-box{
    background:white;
    padding:38px 25px;
    border-radius:30px;
    width:100%;
    max-width:500px;
    text-align:center;
    animation:pop .55s ease;
}

.trophy{
    font-size:75px;
    animation:bounce 1s infinite;
}

.congrats-box h1{
    font-size:40px;
    margin:10px 0;
}

.congrats-box p{
    font-size:21px;
    color:#555;
}

@keyframes pop{
    0%{
        transform:scale(.3);
        opacity:0;
    }
    70%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-12px);
    }
}

/* CONFETTI */

.confetti{
    position:fixed;
    width:10px;
    height:18px;
    top:-25px;
    z-index:10000;
    animation:fall 3.5s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:13px 20px;
    border-radius:25px;
    display:none;
    z-index:20000;
}

/* MOBILE */

@media(max-width:500px){

    .container{
        padding:12px;
    }

    .header{
        padding:22px 12px;
    }

    .header h1{
        font-size:28px;
    }

    .header p{
        font-size:18px;
    }

    .card{
        padding:20px;
        border-radius:23px;
    }

    .top{
        font-size:17px;
    }

    .timer{
        padding:9px 13px;
        font-size:16px;
    }

    .question{
        font-size:23px;
    }

    .option{
        font-size:18px;
        padding:16px;
    }

    .congrats-box h1{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">
        <h1>🌿 BTBD Botany Exam</h1>
        <p>UPHESC Assistant Professor Botany Preparation</p>
    </div>


    <!-- QUIZ -->

    <div id="quizArea">

        <div class="card">

            <div class="top">

                <span id="questionNo">
                    Question 1 / 20
                </span>

                <span class="timer" id="timer">
                    50:00
                </span>

            </div>


            <!-- PROGRESS -->

            <div class="progress">
                <div
                    class="progress-bar"
                    id="progressBar">
                </div>
            </div>


            <!-- TOPIC -->

            <div class="topic" id="topic">
                🌿 Botany
            </div>


            <!-- QUESTION -->

            <div
                class="question"
                id="question">
                Loading question...
            </div>


            <!-- OPTIONS -->

            <div id="options"></div>


            <!-- NEXT -->

            <button
                class="next"
                id="nextBtn"
                onclick="nextQuestion()">

                Next Question →

            </button>

        </div>


        <!-- SUBMIT -->

        <button
            class="submit"
            onclick="submitTest()">

            🏁 Submit Test

        </button>

    </div>


    <!-- RESULT -->

    <div
        class="card result"
        id="result">

        <h2>📊 Test Result</h2>

        <div
            class="score"
            id="finalScore">
            0 / 0
        </div>

        <div
            class="stats"
            id="resultStats">
        </div>

        <h2
            id="resultMessage">
        </h2>

        <button
            class="next"
            onclick="location.reload()">

            🔄 Restart Test

        </button>

    </div>

</div>


<!-- CONGRATULATIONS -->

<div
    class="congrats"
    id="congrats">

    <div class="congrats-box">

        <div class="trophy">
            🏆
        </div>

        <h1>
            🎉 Congratulations!
        </h1>

        <p id="congratsText">
            Excellent performance!
        </p>

        <button
            class="next"
            onclick="closeCongrats()">

            Continue →

        </button>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   BTBD BOTANY QUIZ ENGINE
===================================================== */


/* QUESTIONS */

let questions = [];


/* QUIZ STATE */

let current = 0;
let score = 0;
let selected = false;


/* TIMER */

let totalSeconds = 50 * 60;
let timerInterval;


/* AUDIO */

let audioContext = null;


/* =====================================================
   AUDIO ENGINE
===================================================== */

function startAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state === "suspended"){

            audioContext.resume();

        }

    }catch(error){

        console.log("Audio unavailable");

    }

}


/* BASIC SOUND */

function beep(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    try{

        startAudio();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type = type;

        oscillator.frequency.value =
            frequency;


        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + duration
        );

    }catch(error){

        console.log(error);

    }

}


/* OPTION CLICK */

function clickSound(){

    beep(
        650,
        .08,
        "sine",
        .06
    );

}


/* CORRECT */

function correctSound(){

    beep(
        700,
        .12,
        "sine",
        .07
    );


    setTimeout(function(){

        beep(
            1000,
            .18,
            "sine",
            .08
        );

    },100);

}


/* WRONG */

function wrongSound(){

    beep(
        180,
        .20,
        "sawtooth",
        .06
    );

}


/* NEXT SOUND */

function nextSound(){

    beep(
        500,
        .07,
        "sine",
        .05
    );

}


/* =====================================================
   CONGRATULATIONS SOUND
===================================================== */

function congratulationsSound(){

    startAudio();


    const notes = [

        523,
        659,
        784,
        1047,
        784,
        1047

    ];


    notes.forEach(function(note,index){

        setTimeout(function(){

            beep(
                note,
                .22,
                "sine",
                .10
            );

        },index * 130);

    });

}


/* =====================================================
   LOAD MCQS.JSON
===================================================== */

fetch("mcqs.json")

.then(function(response){

    if(!response.ok){

        throw new Error(
            "mcqs.json not found"
        );

    }

    return response.json();

})


.then(function(data){

    if(!Array.isArray(data)){

        throw new Error(
            "MCQ JSON must be an array"
        );

    }


    questions = data.slice(0,20);


    if(questions.length === 0){

        throw new Error(
            "No questions available"
        );

    }


    showQuestion();

})


.catch(function(error){

    console.log(error);


    document.getElementById(
        "question"
    ).innerHTML =

        "⚠️ MCQ loading error.<br><br>" +

        "Please check that <b>mcqs.json</b> " +
        "is present in the same folder.";

});


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    selected = false;


    const q =
        questions[current];


    /* QUESTION NUMBER */

    document.getElementById(
        "questionNo"
    ).innerText =

        `Question ${current + 1} / ${questions.length}`;


    /* TOPIC */

    document.getElementById(
        "topic"
    ).innerText =

        "🌿 " + (q.topic || "Botany");


    /* QUESTION */

    document.getElementById(
        "question"
    ).innerText =

        q.question;


    /* OPTIONS */

    const optionsContainer =
        document.getElementById(
            "options"
        );


    optionsContainer.innerHTML = "";


    q.options.forEach(
        function(option,index){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "option";


            div.innerText =

                `${String.fromCharCode(65 + index)}. ${option}`;


            div.onclick =
                function(){

                    selectAnswer(
                        index,
                        div
                    );

                };


            optionsContainer.appendChild(
                div
            );

        }
    );


    /* PROGRESS */

    const progress =
        ((current + 1) /
        questions.length) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    /* BUTTON */

    if(
        current ===
        questions.length - 1
    ){

        document.getElementById(
            "nextBtn"
        ).innerText =
            "🏁 Finish Questions";

    }else{

        document.getElementById(
            "nextBtn"
        ).innerText =
            "Next Question →";

    }

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(
    index,
    element
){

    if(selected){

        return;

    }


    startAudio();


    selected = true;


    const q =
        questions[current];


    /* FIND CORRECT ANSWER */

    const correctIndex =
        q.options.findIndex(
            function(option){

                return option === q.answer;

            }
        );


    /* CLICK SOUND */

    clickSound();


    /* CORRECT */

    if(index === correctIndex){

        element.classList.add(
            "correct"
        );


        score++;


        setTimeout(
            correctSound,
            80
        );


    }

    /* WRONG */

    else{

        element.classList.add(
            "wrong"
        );


        wrongSound();


        const allOptions =
            document.querySelectorAll(
                ".option"
            );


        if(
            allOptions[correctIndex]
        ){

            allOptions[
                correctIndex
            ].classList.add(
                "correct"
            );

        }

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    startAudio();


    if(!selected){

        beep(
            250,
            .15,
            "square",
            .05
        );


        showToast(
            "⚠️ Please select an answer first."
        );


        return;

    }


    nextSound();


    if(
        current <
        questions.length - 1
    ){

        current++;


        showQuestion();


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }

    else{

        submitTest();

    }

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(){

    startAudio();


    /* CONFIRM IF CURRENT QUESTION NOT ANSWERED */

    if(
        !selected &&
        current < questions.length
    ){

        const confirmSubmit =
            confirm(
                "Current question is unanswered. Submit test?"
            );


        if(!confirmSubmit){

            return;

        }

    }


    clearInterval(
        timerInterval
    );


    /* HIDE QUIZ */

    document.getElementById(
        "quizArea"
    ).style.display =
        "none";


    /* SHOW RESULT */

    document.getElementById(
        "result"
    ).style.display =
        "block";


    /* SCORE */

    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    document.getElementById(
        "finalScore"
    ).innerText =

        `${score} / ${total}`;


    document.getElementById(
        "resultStats"
    ).innerHTML =

        `Correct: <b>${score}</b><br>` +

        `Incorrect: <b>${total - score}</b><br>` +

        `Percentage: <b>${percentage}%</b>`;


    const message =
        document.getElementById(
            "resultMessage"
        );


    /* PASS */

    if(percentage >= 50){

        message.innerText =
            `🎉 PASS — ${percentage}%`;

        message.className =
            "pass";


        /* SHOW CONGRATULATIONS */

        setTimeout(function(){

            document.getElementById(
                "congrats"
            ).style.display =
                "flex";


            document.getElementById(
                "congratsText"
            ).innerText =

                `You scored ${score} out of ${total}. ` +
                `Keep going — BTBD! 🌿`;


            congratulationsSound();


            createConfetti();


        },500);

    }

    /* FAIL */

    else{

        message.innerText =
            `📚 Keep Practising — ${percentage}%`;

        message.className =
            "fail";

    }

}


/* =====================================================
   CONGRATULATIONS CLOSE
===================================================== */

function closeCongrats(){

    document.getElementById(
        "congrats"
    ).style.display =
        "none";

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    for(
        let i = 0;
        i < 100;
        i++
    ){

        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100 +
            "vw";


        confetti.style.animationDelay =
            Math.random() * 1.5 +
            "s";


        confetti.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        /* Random shapes */

        const size =
            Math.random() * 8 + 7;


        confetti.style.width =
            size + "px";


        confetti.style.height =
            size * 1.6 + "px";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            function(){

                confetti.remove();

            },
            5000
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        message;


    toast.style.display =
        "block";


    setTimeout(
        function(){

            toast.style.display =
                "none";

        },
        1800
    );

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    document.getElementById(
        "timer"
    ).innerText =

        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


    /* LAST 5 MINUTES */

    if(totalSeconds <= 300){

        document.getElementById(
            "timer"
        ).style.background =
            "#fee2e2";

        document.getElementById(
            "timer"
        ).style.color =
            "#dc2626";

    }


    /* TIME OVER */

    if(totalSeconds <= 0){

        clearInterval(
            timerInterval
        );


        alert(
            "⏰ Time Over!"
        );


        submitTest();


        return;

    }


    totalSeconds--;

}


/* START TIMER */

timerInterval =
    setInterval(
        updateTimer,
        1000
    );


updateTimer();

</script>

</body>
</html>
