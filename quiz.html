<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BTBD Botany MCQ Quiz</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .header {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .quiz-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .topic {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #e8f0ff;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 2px solid #ddd;
      background: white;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      border-color: #777;
    }

    .option.correct {
      border-color: #16803c;
      background: #e9f7ef;
    }

    .option.wrong {
      border-color: #c62828;
      background: #fdecec;
    }

    .option:disabled {
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.5;
      display: none;
    }

    .feedback.correct-feedback {
      display: block;
      background: #e9f7ef;
    }

    .feedback.wrong-feedback {
      display: block;
      background: #fdecec;
    }

    .explanation {
      margin-top: 10px;
      font-size: 15px;
    }

    .next-btn,
    .restart-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .next-btn:hover,
    .restart-btn:hover {
      opacity: 0.85;
    }

    .result {
      text-align: center;
      display: none;
    }

    .result h2 {
      font-size: 28px;
    }

    .score {
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #fdecec;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        margin: 10px auto;
        padding: 10px;
      }

      .quiz-card {
        padding: 18px;
      }

      .question {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🌿 BTBD Botany MCQ Quiz</h1>
    <p>Botany The Burning Desire</p>
  </div>

  <div id="loading" class="loading">
    Loading questions...
  </div>

  <div id="quizCard" class="quiz-card" style="display:none;">

    <div class="top-bar">
      <span id="questionNumber"></span>
      <span id="scoreDisplay">Score: 0</span>
    </div>

    <div id="topic" class="topic"></div>

    <div id="question" class="question"></div>

    <div id="options"></div>

    <div id="feedback" class="feedback">
      <strong id="feedbackTitle"></strong>

      <div class="explanation">
        <strong>Explanation:</strong>
        <span id="explanation"></span>
      </div>
    </div>

    <button id="nextBtn" class="next-btn" style="display:none;">
      Next Question →
    </button>

  </div>

  <div id="result" class="quiz-card result">

    <h2>🎉 Quiz Completed!</h2>

    <div class="score" id="finalScore"></div>

    <p id="resultMessage"></p>

    <button class="restart-btn" onclick="restartQuiz()">
      🔄 Restart Quiz
    </button>

  </div>

</div>


<script>

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


// Load MCQs from mcqs.json
async function loadQuestions() {

  try {

    const response = await fetch("mcqs.json");

    if (!response.ok) {
      throw new Error("MCQ file could not be loaded.");
    }

    questions = await response.json();

    if (!Array.isArray(questions) || questions.length === 0) {
      throw new Error("No questions found.");
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("quizCard").style.display = "block";

    showQuestion();

  } catch (error) {

    document.getElementById("loading").innerHTML = `
      <div class="error">
        <strong>⚠️ Error loading quiz</strong>
        <br><br>
        ${error.message}
        <br><br>
        Please make sure <b>mcqs.json</b> is in the same repository.
      </div>
    `;

  }
}


// Show current question
function showQuestion() {

  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;

  document.getElementById("scoreDisplay").textContent =
    `Score: ${score}`;

  document.getElementById("topic").textContent =
    `🌿 ${q.topic}`;

  document.getElementById("question").textContent =
    q.question;

  const optionsContainer =
    document.getElementById("options");

  optionsContainer.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;

    button.onclick = () =>
      checkAnswer(button, option);

    optionsContainer.appendChild(button);

  });

  document.getElementById("feedback").className =
    "feedback";

  document.getElementById("feedback").style.display =
    "none";

  document.getElementById("nextBtn").style.display =
    "none";
}


// Check answer
function checkAnswer(selectedButton, selectedAnswer) {

  if (answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const optionButtons =
    document.querySelectorAll(".option");

  optionButtons.forEach(button => {
    button.disabled = true;

    const text = button.textContent.substring(3);

    if (text === q.answer) {
      button.classList.add("correct");
    }
  });

  const feedback =
    document.getElementById("feedback");

  const feedbackTitle =
    document.getElementById("feedbackTitle");

  const explanation =
    document.getElementById("explanation");

  if (selectedAnswer === q.answer) {

    score++;

    selectedButton.classList.add("correct");

    feedbackTitle.textContent =
      "✅ Correct!";

    feedback.className =
      "feedback correct-feedback";

  } else {

    selectedButton.classList.add("wrong");

    feedbackTitle.textContent =
      `❌ Wrong! Correct answer: ${q.answer}`;

    feedback.className =
      "feedback wrong-feedback";

  }

  explanation.textContent =
    q.explanation || "No explanation available.";

  document.getElementById("scoreDisplay").textContent =
    `Score: ${score}`;

  document.getElementById("nextBtn").style.display =
    "block";
}


// Next question
document.getElementById("nextBtn").onclick =
  function() {

    currentQuestion++;

    if (currentQuestion < questions.length) {

      showQuestion();

    } else {

      showResult();

    }

  };


// Show final result
function showResult() {

  document.getElementById("quizCard").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("finalScore").textContent =
    `${score} / ${questions.length}`;

  document.getElementById("resultMessage").textContent =
    `Your accuracy is ${percentage}%.`;

}


// Restart
